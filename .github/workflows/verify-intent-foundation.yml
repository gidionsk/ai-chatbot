name: Verify TanyaAI Intent Foundation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/intent-foundation
  pull_request:
    branches:
      - startingpoint

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check Swift toolchain
        run: xcodebuild -version && swift --version
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run repository verification
        run: sh Scripts/verify.sh
