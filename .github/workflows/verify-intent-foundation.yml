name: Verify TanyaAI Intent Foundation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - startingpoint

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Run repository verification
        run: sh Scripts/verify.sh
